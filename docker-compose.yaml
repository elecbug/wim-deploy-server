name: wim-deploy

services:
  samba:
    build:
      context: ./samba
    container_name: wim-deploy-samba
    restart: unless-stopped

    environment:
      SAMBA_USER: "${SAMBA_USER:-deploy}"
      SAMBA_PASSWORD_FILE: "/run/secrets/samba_password"

    secrets:
      - samba_password

    ports:
      # Direct-IP SMB access from the campus network.
      # Bind only to the server's campus-facing IP.
      - "${SERVER_IP:?Set SERVER_IP in .env}:445:445/tcp"

    volumes:
      - type: bind
        source: "${DISKS_REALPATH:?Run ./manage.sh instead of docker compose directly}"
        target: /srv/deployment
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./samba/smb.conf
        target: /etc/samba/smb.conf
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      test: ["CMD-SHELL", "smbclient -L localhost -U \"$${SAMBA_USER}%$$(cat /run/secrets/samba_password)\" -m SMB3 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - SETGID
      - SETUID

    tmpfs:
      - /run:size=32m,mode=0755
      - /var/cache/samba:size=32m,mode=0755
      - /var/lib/samba:size=64m,mode=0755
      - /var/log/samba:size=64m,mode=0755

    networks:
      - wim-deploy-net

networks:
  wim-deploy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.230.0.0/24

secrets:
  samba_password:
    file: ./secrets/samba_password.txt
