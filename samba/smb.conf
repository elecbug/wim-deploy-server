[global]
    server role = standalone server
    workgroup = WORKGROUP
    netbios name = WIMDEPLOY

    security = user
    map to guest = never
    restrict anonymous = 2

    server min protocol = SMB2
    server max protocol = SMB3

    # Direct-IP access only; no NetBIOS discovery is required.
    disable netbios = yes
    smb ports = 445

    # Replace this with the actual campus-facing interface/IP range.
    # The Docker published-port binding also limits exposure to SERVER_IP.
    hosts allow = 127.0.0.1 172.20.4.0/24
    hosts deny = 0.0.0.0/0

    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

    log file = /var/log/samba/log.%m
    max log size = 1000
    logging = file

[deployment]
    path = /srv/deployment
    browseable = yes
    read only = yes
    guest ok = no
    valid users = deploy

    follow symlinks = no
    wide links = no
